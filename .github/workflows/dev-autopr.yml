name: Dev Auto PR

on:
  push:
    branches: [ dev ]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-or-update-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR dev -> master exists
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.EDITOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing required secret: EDITOR_GITHUB_TOKEN"
            exit 1
          fi

          PR_NUMBER="$(gh pr list --base master --head dev --state open --json number --jq '.[0].number')"
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            gh pr create \
              --base master \
              --head dev \
              --title "dev: sync editor changes" \
              --body "Automated PR generated from editor updates in \`dev\`."
            PR_NUMBER="$(gh pr list --base master --head dev --state open --json number --jq '.[0].number')"
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge when checks pass
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.EDITOR_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --base master --head dev --state open --json number --jq '.[0].number')"
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "No open PR found for dev -> master"
            exit 1
          fi
          gh pr merge "${PR_NUMBER}" --auto --squash
